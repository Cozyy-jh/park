<style>
/* 트러스트 파이프라인 MVP — 고객용·영업자용 공용 스타일. 값은 피그마 색 변수와 화면설계서 치수를 따른다. */
:root {
  --primary: #2F6FED;
  --primary-strong: #1F5AD6;
  --primary-bg: #EAF1FF;
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --text: #191F28;
  --text-sub: #4E5968;
  --text-weak: #5F6B7A;
  --text-muted: #8B95A1;
  --line: #E5E8EB;
  --success: #0B7A4B;
  --success-bg: #E3F5EC;
  --warning: #9A5007; /* 피그마 값(#B25E09)보다 조금 어둡게: 연한 바탕 위 글자 대비 4.5:1 확보 */
  --warning-bg: #FFF1DB;
  --danger: #D92D20;
  --danger-strong: #B42318;
  --danger-bg: #FDECEA;
  --disabled: #C9D1DB;
  --off: #B0B8C1;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #E9ECEF; color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.45; word-break: keep-all;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
button { padding: 0; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.center { text-align: center; }

.screen { position: relative; max-width: 430px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); }

/* ---------- 고객용 R-01, R-02 ---------- */
.customer-screen { display: flex; flex-direction: column; justify-content: space-between; padding: 24px 16px 16px; }

.card { display: block; width: 100%; aspect-ratio: 328 / 182; border-radius: 12px; perspective: 1200px; }
.card-inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
.card[aria-pressed="true"] .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: block; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.face-back { transform: rotateY(180deg); }
.face.loading { background: #E9ECEF; }
.face img { display: block; width: 100%; height: 100%; object-fit: cover; }
.face-text { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 20px; text-align: left; }
.face-text-back { align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ft-co { font-size: 12px; line-height: 16px; color: var(--text-sub); }
.ft-main { display: block; }
.ft-name { display: block; font-size: 24px; font-weight: 700; line-height: 30px; }
.ft-name-sm { font-size: 16px; font-weight: 700; line-height: 24px; }
.ft-sub { display: block; font-size: 13px; line-height: 18px; color: var(--text-sub); }

.hint { margin-top: 8px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-sub); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; border-radius: 14px; background: var(--surface); font-size: 13px; font-weight: 500; line-height: 18px; }
.action:active { background: #E9EDF2; }
.action > svg { color: var(--primary); }

.badge { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; line-height: 14px; }
.badge[data-state="valid"] { color: var(--success); }
.badge[data-state="partial"] { color: var(--warning); }
.badge[data-state="expired"] { color: var(--text-weak); }
.popup .badge { gap: 3px; padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 16px; }
.popup .badge[data-state="valid"] { background: var(--success-bg); }
.popup .badge[data-state="partial"] { background: var(--warning-bg); }
.popup .badge[data-state="expired"] { background: var(--bg); }

.icon-links { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
.icon-link { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--text-sub); }

.demo-notice { margin-top: 24px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-sub); }
.demo-notice small { display: block; margin-top: 2px; font-size: 11px; line-height: 14px; color: var(--text-weak); }

/* ---------- 토스트, 팝업, 시트 ---------- */
.toast { position: fixed; left: 50%; bottom: 56px; z-index: 60; width: min(312px, calc(100% - 48px)); min-height: 40px; padding: 11px 12px; border-radius: 12px; background: var(--text); color: #fff; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.dim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .6); opacity: 0; transition: opacity .2s; }
.dim.show { opacity: 1; }

.popup { position: fixed; left: 50%; top: 50%; z-index: 50; width: min(398px, calc(100% - 32px)); max-height: min(640px, calc(100vh - 48px)); overflow-y: auto; padding: 20px; border-radius: 16px; background: var(--surface); outline: 0; opacity: 0; transform: translate(-50%, -48%); transition: opacity .2s, transform .2s; }
.popup.show { opacity: 1; transform: translate(-50%, -50%); }
.popup-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.popup-head h2 { font-size: 20px; line-height: 28px; }
.popup-who { margin: 4px 0 8px; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.verify-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.verify-label { font-size: 15px; font-weight: 500; line-height: 22px; }
.verify-state { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; line-height: 18px; color: var(--text-sub); text-align: right; }
.verify-state small { font-size: 12px; line-height: 16px; color: var(--text-weak); }
.verify-row[data-status="pending"] .verify-main { color: var(--warning); font-weight: 500; }
.verify-row[data-status="expired"] .verify-label, .verify-row[data-status="expired"] .verify-main { color: var(--text-weak); }
.popup-note { margin-top: 10px; font-size: 13px; color: var(--warning); }
.popup-foot { margin: 10px 0 14px; font-size: 12px; line-height: 18px; color: var(--text-sub); }

.sheet { position: fixed; left: 50%; bottom: 0; z-index: 50; display: flex; flex-direction: column; width: min(430px, 100%); height: min(720px, 90vh); padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--surface); outline: 0; opacity: 0; transform: translate(-50%, 24px); transition: opacity .2s, transform .25s; }
.sheet.show { opacity: 1; transform: translate(-50%, 0); }
.sheet-auto { height: auto; max-height: 90vh; }
.sheet-detail { height: min(640px, 90vh); }
.grip { flex: none; width: 36px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: var(--line); }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.sheet-head h2 { display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px; }
.sheet-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.sheet-body { flex: 1; min-height: 0; margin: 0 -16px; padding: 0 16px 4px; overflow-y: auto; }
.sheet-foot { flex: none; padding-top: 12px; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -10px; border-radius: 50%; color: var(--text-sub); }
.icon-btn:disabled { color: var(--disabled); }
.back-btn { margin: 0 0 0 -10px; color: var(--text); }

/* ---------- 버튼, 입력 ---------- */
.btn-primary, .btn-secondary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 12px; font-size: 16px; line-height: 24px; }
.btn-primary { background: var(--primary); color: #fff; font-weight: 700; }
.btn-primary:disabled { background: var(--disabled); }
.btn-secondary { background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); color: var(--primary-strong); font-weight: 500; }
.btn-secondary:disabled { box-shadow: inset 0 0 0 1px var(--disabled); color: var(--off); }
.btn-small { height: 40px; border-radius: 10px; font-size: 14px; line-height: 20px; }
.link-btn { min-height: 44px; padding: 0 4px; color: var(--primary-strong); font-size: 13px; font-weight: 500; }
.link-btn.sub { color: var(--text-sub); text-decoration: underline; }
.text-link { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 500; color: var(--text-sub); text-decoration: underline; }

.field { margin-top: 12px; }
.field label, .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.form-label { margin-top: 20px; }
.input, .textarea { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; outline: 0; }
.input { height: 48px; padding: 0 16px; }
.textarea { height: 96px; padding: 12px 16px; resize: none; }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.input:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.input:disabled { background: var(--bg); }
.has-error .input, .input.is-error { border-color: var(--danger); }
.error { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--danger); }
.inline-notice { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--danger-bg); color: var(--danger-strong); font-size: 13px; line-height: 18px; }

/* ---------- 고객용 R-04, R-05 ---------- */
.stepper { display: flex; gap: 6px; padding-bottom: 12px; font-size: 13px; line-height: 18px; color: var(--text-weak); }
.stepper .on { color: var(--primary-strong); font-weight: 700; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 8px; }
.month-nav strong { min-width: 104px; text-align: center; font-size: 16px; line-height: 24px; }
.month-nav .icon-btn { margin: 0; }
.cal-row { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-head span { height: 24px; text-align: center; font-size: 12px; line-height: 24px; color: var(--text-weak); }
.day-wrap { display: grid; place-items: center; height: 40px; }
.day { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; line-height: 22px; color: var(--off); }
button.day { color: var(--text); font-weight: 500; }
button.day::after { content: ""; position: absolute; inset: -2px -5px; }
.day[data-state="today"] { box-shadow: inset 0 0 0 1px var(--disabled); }
.day[data-state="selected"] { background: var(--primary); color: #fff; font-weight: 700; }
.sub-label { margin: 10px 0 8px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { position: relative; height: 40px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; }
.slot::after { content: ""; position: absolute; inset: -2px 0; }
.slot[data-state="selected"] { background: var(--primary); box-shadow: none; color: #fff; font-weight: 700; }
.slot[data-state="closed"] { background: var(--bg); box-shadow: none; color: var(--off); text-decoration: line-through; }
.empty-box { padding: 24px 16px; border-radius: 12px; background: var(--bg); text-align: center; font-size: 14px; line-height: 20px; color: var(--text-sub); }
.summary { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 12px; padding: 0 16px; border-radius: 12px; background: var(--primary-bg); font-size: 15px; font-weight: 500; line-height: 22px; }
.stepper + .summary { margin-top: 0; }
.summary .link-btn { margin-right: -4px; }

.consent { margin-top: 16px; }
.consent-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.check { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer; }
.check-input { position: absolute; left: 0; top: 10px; width: 24px; height: 24px; margin: 0; opacity: 0; }
.check-box { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid var(--off); border-radius: 6px; color: transparent; }
.check-input:checked + .check-box { border-color: var(--primary); background: var(--primary); color: #fff; }
.check-input:focus-visible + .check-box { outline: 2px solid var(--primary); outline-offset: 2px; }
.has-error .check-box { border-color: var(--danger); }
.consent-detail { margin-top: 6px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: 12px; line-height: 18px; color: var(--text-sub); }

.done-mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 32px auto 20px; border-radius: 50%; background: var(--success-bg); color: var(--success); }
.done-title { text-align: center; font-size: 20px; line-height: 28px; }
.kv { display: grid; gap: 10px; margin-top: 20px; padding: 16px; border-radius: 12px; background: var(--bg); }
.kv div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kv dt { flex: none; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.kv dd { font-size: 14px; font-weight: 500; line-height: 20px; text-align: right; overflow-wrap: anywhere; }
.done-guide { margin-top: 16px; text-align: center; font-size: 13px; line-height: 20px; color: var(--text-sub); }

/* ---------- 영업자용 S-01 ---------- */
.login { display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; min-height: 100dvh; padding: 128px 16px 24px; background: var(--surface); }
.login-service { text-align: center; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.login h1 { text-align: center; font-size: 24px; line-height: 32px; }
.card-summary { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; margin-top: 32px; padding: 8px; border-radius: 12px; background: var(--bg); text-align: center; }
.card-summary strong { font-size: 15px; line-height: 20px; }
.card-summary span { font-size: 12px; line-height: 16px; color: var(--text-sub); }
.login-form { margin-top: 24px; }
.login-form label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.login-form .btn-primary { margin-top: 16px; }
.pin { font-size: 20px; letter-spacing: .4em; }
.login-key { margin-bottom: 16px; }
.field-hint { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--text-sub); }

/* ---------- 영업자용 공통 틀 ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.band { flex: none; padding: 4px 12px; background: var(--warning-bg); color: var(--warning); font-size: 12px; font-weight: 500; line-height: 16px; text-align: center; }
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; }
.topbar h1 { font-size: 20px; line-height: 28px; }
.topbar-count { font-size: 13px; color: var(--text-sub); }
.share-btn { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px 0 10px; border-radius: 16px; background: var(--primary-bg); color: var(--primary-strong); font-size: 13px; font-weight: 700; }
.share-btn::after { content: ""; position: absolute; inset: -6px 0; }
.view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 12px 16px 16px; overflow-y: auto; }
.view > * { flex: none; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: var(--surface); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-sub); font-size: 11px; font-weight: 500; line-height: 14px; }
.tab[aria-current="page"] { color: var(--primary-strong); font-weight: 700; }
.tab-label { display: inline-flex; align-items: flex-start; gap: 2px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--danger); }

.chips { display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { position: relative; flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-sub); font-size: 13px; font-weight: 500; }
.chip::after { content: ""; position: absolute; inset: -6px 0; }
.chip[data-selected="true"] { background: var(--text); box-shadow: none; color: #fff; font-weight: 700; }

/* ---------- 영업자용 S-02 ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 72px; padding: 0 14px; border-radius: 14px; background: var(--surface); }
.stat dt { font-size: 13px; line-height: 18px; color: var(--text-sub); }
.stat dd { font-size: 24px; font-weight: 700; line-height: 30px; }
.rate { margin-top: -4px; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.block { padding: 16px; border-radius: 16px; background: var(--surface); }
.block h2 { margin-bottom: 12px; font-size: 16px; line-height: 24px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; height: 24px; font-size: 13px; line-height: 18px; }
.bar-name { color: var(--text-sub); }
.bar-track { height: 8px; overflow: hidden; border-radius: 4px; background: var(--bg); }
.bar-track i { display: block; height: 100%; border-radius: 4px; background: var(--primary); }
.bar-count { text-align: right; font-weight: 500; }
.activity { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.activity:last-child { border-bottom: 0; }
.activity strong { display: block; font-size: 14px; line-height: 20px; }
.activity p { font-size: 13px; line-height: 18px; color: var(--text-sub); }
.activity-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 16px; color: var(--text-sub); }
.activity-side .link-btn { position: relative; min-height: 28px; font-size: 12px; font-weight: 700; }
.activity-side .link-btn::after { content: ""; position: absolute; inset: -8px -8px; }
.more-btn { display: block; width: 100%; height: 44px; font-size: 13px; font-weight: 500; color: var(--text-sub); }
.empty-state { padding: 32px 16px 24px; border-radius: 16px; background: var(--surface); text-align: center; font-size: 14px; line-height: 20px; color: var(--text-sub); }
.empty-state .btn-primary { width: 160px; margin: 14px auto 0; }
.notice-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-radius: 10px; background: var(--danger-bg); color: var(--danger-strong); font-size: 13px; }
.notice-row .link-btn { color: var(--danger-strong); text-decoration: underline; }

/* js/core.js */
/*

    schedule_open: '일정 열람', schedule_submit: '일정 신청',

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- 날짜 ---------- */

  function toUtcMs(dateStr) {
    var p = String(dateStr).split('-');

  function verifyRow(item) {
    var lines = Core.verifyLines(item);
    return el('li', { class: 'verify-row', dataset: { status: item.status } }, [
      el('span', { class: 'verify-label', text: item.label }),
      el('span', { class: 'verify-state' }, [el('span', { class: 'verify-main', text: lines.main })].concat(
        lines.subs.map(function (text) { return el('small', { text: text }); })
      ))
    ]);
  }

  function openVerify() {
    var popup = document.getElementById('verify-popup');
    var badge = Core.badgeState(card.verify);
    var latest = Core.latestCheck(card.verify);
    var who = [card.name, [card.company, card.division].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
    store.logEvent('verify_open', { badge: badge });

    popup.textContent = '';
    [
      el('div', { class: 'popup-head' }, [el('h2', { id: 'verify-title', text: '인증내역' }), badgeNode(badge)]),
      el('p', { class: 'popup-who', text: who }),
      el('ul', { class: 'verify-list' }, Core.visibleItems(card.verify).map(verifyRow)),
      badge === 'none' ? el('p', { class: 'popup-note', text: '확인 중인 항목이 있습니다' }) : null,
      el('p', { class: 'popup-foot' }, [
        latest ? '최종 확인 ' + Core.formatDotDate(latest) : null,
        latest ? el('br') : null,
        MSG.demo
      ]),
      el('button', { type: 'button', class: 'btn-secondary', onclick: UI.closeLayer }, ['닫기'])
    ].forEach(function (node) { if (node) popup.appendChild(node); });
    UI.openLayer(popup);
  }

  /* ---------- R-04, R-05 일정 시트 ---------- */

  function initialState() {
    var today = Core.kstDate(Date.now());
    return {
      step: 1, today: today, year: Number(today.slice(0, 4)), month: Number(today.slice(5, 7)),
      hours: card.hours, closed: [], loading: true, loadFailed: false, date: '', slot: '', notice: '',
      name: '', phone: '', purpose: '', consent: false, consentOpen: false,
      errors: {}, submitError: '', submitting: false
    };
  }

  /** 상태를 바꾸고 시트를 다시 그린다. focusSelector 가 있으면 그 요소로 초점을 옮긴다. */
  function setState(patch, focusSelector) {
    state = Object.assign({}, state, patch);
    renderSheet(focusSelector);
  }

  /** 글자를 입력하는 동안에는 다시 그리지 않는다 (입력 중인 칸의 초점을 지키기 위해). */
  function setQuiet(patch) { state = Object.assign({}, state, patch); }

  function monthIndex(dateStr) { return Number(dateStr.slice(0, 4)) * 12 + Number(dateStr.slice(5, 7)); }

  function hasSelectableDate() {
    var range = Core.bookingWindow(state.today);
    for (var d = range.first; d <= range.last; d = Core.addDays(d, 1)) {
      if (Core.isSelectable(d, state.today, state.hours, state.closed)) return true;
    }
    return false;
  }

  function sheetHead() {
    return el('div', { class: 'sheet-head' }, [
      el('h2', { id: 'schedule-title', text: '일정 잡기' }),
      el('button', { type: 'button', class: 'icon-btn', 'aria-label': '닫기', onclick: requestClose }, [icon('close')])
    ]);
  }

  function stepper() {
    var step = function (n, label) {
      var on = state.step === n;
      return el('span', { class: on ? 'on' : null, 'aria-current': on ? 'step' : null, text: label });
    };
    return el('p', { class: 'stepper' }, [step(1, '1 날짜·시간'), el('span', { 'aria-hidden': 'true', text: '—' }), step(2, '2 신청자 정보')]);
  }

  function monthNav() {
    var current = state.year * 12 + state.month;
    var min = monthIndex(state.today);
    var max = monthIndex(Core.bookingWindow(state.today).last);
    var go = function (delta, focusSelector) {
      var index = current + delta - 1;
      setState({ year: Math.floor(index / 12), month: (index % 12) + 1 }, focusSelector);
    };
    return el('div', { class: 'month-nav' }, [
      el('button', { type: 'button', id: 'cal-prev', class: 'icon-btn', 'aria-label': '이전 달', disabled: current <= min, onclick: function () { go(-1, '#cal-prev'); } }, [icon('left')]),
      el('strong', { 'aria-live': 'polite', text: state.year + '년 ' + state.month + '월' }),
      el('button', { type: 'button', id: 'cal-next', class: 'icon-btn', 'aria-label': '다음 달', disabled: current >= max, onclick: function () { go(1, '#cal-next'); } }, [icon('right')])
    ]);
  }

  function pickDate(date) {
    if (date === state.date) return;
    store.logEvent('schedule_date_select', { date: date });
    setState({ date: date, slot: '', notice: '' }, '.day[data-date="' + date + '"]');
  }

  function dayCell(date) {
    if (!date) return el('span', { class: 'day-wrap' });
    var dayNumber = String(Number(date.slice(8)));
    var selectable = Core.isSelectable(date, state.today, state.hours, state.closed);
    var dayState = date === state.date ? 'selected' : date === state.today ? 'today' : selectable ? 'default' : 'off';
    if (!selectable) {
      return el('span', { class: 'day-wrap' }, [
        el('span', { class: 'day', dataset: { state: dayState }, 'aria-disabled': 'true', text: dayNumber })
      ]);
    }
    var label = Number(date.slice(5, 7)) + '월 ' + dayNumber + '일 ' + Core.WEEKDAY_NAMES[Core.weekday(date)] + '요일';
    return el('span', { class: 'day-wrap' }, [
      el('button', {
        type: 'button', class: 'day', dataset: { state: dayState, date: date }, 'aria-label': label,
        'aria-pressed': String(date === state.date), onclick: function () { pickDate(date); }, text: dayNumber
      })
    ]);
  }

  function calendar() {
    var head = el('div', { class: 'cal-row cal-head', 'aria-hidden': 'true' },
      Core.WEEKDAY_NAMES.map(function (name) { return el('span', { text: name }); }));
    var weeks = Core.monthGrid(state.year, state.month).map(function (week) {
      return el('div', { class: 'cal-row' }, week.map(dayCell));
    });
    return el('div', { class: 'calendar', role: 'group', 'aria-label': state.year + '년 ' + state.month + '월 날짜 선택' }, [head].concat(weeks));
  }

  function pickSlot(key) {
    store.logEvent('schedule_time_select', { time: key.slice(11) + ':00' });
    setState({ slot: key, notice: '' }, '.slot[data-slot="' + key + '"]');
  }

  function slotButton(slot) {
    var slotState = slot.closed ? 'closed' : slot.key === state.slot ? 'selected' : 'default';
    return el('button', {
      type: 'button', class: 'slot', dataset: { state: slotState, slot: slot.key }, disabled: slot.closed,
      'aria-pressed': String(slot.key === state.slot),
      'aria-label': slot.period + ' ' + slot.label + (slot.closed ? ' 마감' : ''),
      onclick: function () { pickSlot(slot.key); }, text: slot.label
    });
  }

  function timeArea() {
    if (!state.date) {
      return el('div', {}, [el('h3', { class: 'sub-label', text: '시간 선택' }), el('p', { class: 'empty-box', text: MSG.pickDate })]);
    }
    var slots = Core.slotsFor(state.date, state.hours, state.closed);
    var group = function (period) {
      var list = slots.filter(function (s) { return s.period === period; });
      if (!list.length) return null;
      return el('div', {}, [el('h3', { class: 'sub-label', text: period }), el('div', { class: 'slots' }, list.map(slotButton))]);
    };
    return el('div', {}, [group('오전'), group('오후')]);
  }

  /** 일정을 아직 못 읽었을 때의 내용. 마감 여부를 모르는 채로 날짜를 고르게 하지 않는다. */
  function slotsPending() {
    if (state.loading) return [stepper(), el('p', { class: 'loading-text', role: 'status', text: MSG.slotsLoading })];
    return [
      stepper(),
      el('p', { class: 'inline-notice', role: 'alert', text: MSG.slotsFailed }),
      el('p', { class: 'center' }, [
        el('button', { type: 'button', id: 'slots-retry', class: 'link-btn', onclick: function () { setState({ loading: true, loadFailed: false }); loadSlots(); } }, ['다시 시도'])
      ])
    ];
  }

  function stepDate() {
    if (state.loading || state.loadFailed) {
      return { head: sheetHead(), body: slotsPending(), foot: [el('button', { type: 'button', class: 'btn-primary', disabled: true }, ['다음'])] };
    }
    var noDate = !hasSelectableDate();
    var body = [
      stepper(), monthNav(), calendar(),
      state.notice ? el('p', { class: 'inline-notice', role: 'alert', text: state.notice }) : null,
      noDate ? el('p', { class: 'empty-box', role: 'status' }, [MSG.noDate[0], el('br'), MSG.noDate[1]]) : timeArea(),
      state.slot ? el('p', { class: 'summary', text: Core.formatSlot(state.slot) }) : null
    ];
    var next = el('button', {
      type: 'button', class: 'btn-primary', disabled: !state.slot,
      onclick: function () { setState({ step: 2, notice: '' }, '#f-name'); }
    }, ['다음']);
    return { head: sheetHead(), body: body, foot: [next] };
  }

  function canSubmit() {
    return state.name.trim() !== '' && Core.digits(state.phone) !== '' && state.consent;
  }

  function syncSubmitButton() {
    var button = document.getElementById('submit-btn');
    if (button) button.disabled = !canSubmit() || state.submitting;
  }

  function field(id, label, attrs, error, onInput) {
    var input = el('input', Object.assign({
      id: id, class: 'input', 'aria-invalid': error ? 'true' : null, 'aria-describedby': error ? id + '-err' : null
    }, attrs));
    input.addEventListener('input', function () {
      onInput(input);
      syncSubmitButton();
    });
    return el('div', { class: 'field' + (error ? ' has-error' : '') }, [
      el('label', { for: id, text: label }), input,
      error ? el('p', { class: 'error', id: id + '-err', text: error }) : null
    ]);
  }

  function consentBlock() {
    var error = state.errors.consent;
    var box = el('input', {
      type: 'checkbox', id: 'f-consent', class: 'check-input',
      'aria-invalid': error ? 'true' : null, 'aria-describedby': error ? 'f-consent-err' : null
    });
    box.checked = state.consent;
    box.addEventListener('change', function () {
      setQuiet({ consent: box.checked });
      syncSubmitButton();
    });
    var toggle = el('button', {
      type: 'button', id: 'consent-toggle', class: 'link-btn sub', 'aria-expanded': String(state.consentOpen),
      onclick: function () { setState({ consentOpen: !state.consentOpen }, '#consent-toggle'); }
    }, ['내용 보기']);
    return el('div', { class: 'consent' + (error ? ' has-error' : '') }, [
      el('div', { class: 'consent-row' }, [
        el('label', { class: 'check', for: 'f-consent' }, [
          box, el('span', { class: 'check-box', 'aria-hidden': 'true' }, [icon('check', 16, 2.6)]),
          el('span', { text: '개인정보 수집·이용 동의 (필수)' })
        ]),
        toggle
      ]),
      error ? el('p', { class: 'error', id: 'f-consent-err', text: error }) : null,
      state.consentOpen ? el('ul', { class: 'consent-detail' }, CONSENT_LINES.map(function (t) { return el('li', { text: t }); })) : null
    ]);
  }

  function stepForm() {
    var errors = state.errors;
    var body = [
      stepper(),
      el('p', { class: 'summary' }, [
        el('span', { text: Core.formatSlot(state.slot) }),
        el('button', {
          type: 'button', class: 'link-btn',
          onclick: function () { setState({ step: 1, errors: {}, submitError: '' }, '.slot[data-state="selected"]'); }
        }, ['변경'])
      ]),
      field('f-name', '이름 (필수)', { type: 'text', value: state.name, maxlength: '20', autocomplete: 'name', placeholder: '예: 홍길동' },
        errors.name, function (input) { setQuiet({ name: input.value }); }),
      field('f-phone', '연락처 (필수)', { type: 'tel', inputmode: 'numeric', value: state.phone, maxlength: '13', autocomplete: 'tel', placeholder: '예: 010-0000-0000' },
        errors.phone, function (input) {
          var formatted = Core.formatPhone(input.value);
          if (formatted !== input.value) input.value = formatted;
          setQuiet({ phone: formatted });
        }),
      field('f-purpose', '용건 (선택)', { type: 'text', value: state.purpose, maxlength: '100', placeholder: '예: 상담 문의' },
        '', function (input) { setQuiet({ purpose: input.value }); }),
      consentBlock(),
      state.submitError ? el('p', { class: 'inline-notice', role: 'alert', text: state.submitError }) : null
    ];
    var submit = el('button', {
      type: 'submit', class: 'btn-primary', id: 'submit-btn', disabled: !canSubmit() || state.submitting
    }, [state.submitting ? '신청 중…' : '신청하기']);
    return { head: sheetHead(), body: body, foot: [submit], onSubmit: submitBooking };
  }

  function submitBooking(event) {
    event.preventDefault();
    if (state.submitting) return; // 여러 번 눌러도 한 번만 저장한다
    var errors = Core.validateBooking({ name: state.name, phone: state.phone, consent: state.consent });
    if (Object.keys(errors).length) {
      setState({ errors: errors, submitError: '' }, errors.name ? '#f-name' : errors.phone ? '#f-phone' : '#f-consent');
      return;
    }
    var slot = state.slot;
    var session = openCount;
    setState({ errors: {}, submitError: '', submitting: true });
    store.book({ slot: slot, name: state.name.trim(), phone: Core.digits(state.phone), purpose: state.purpose.trim() })
      .then(function (result) {
        slotsRequest = null; // 신청을 시도했으면 마감 상황이 달라졌을 수 있다
        // 저장됐으면 화면 상태와 상관없이 기록한다
        if (result.success) store.logEvent('schedule_submit', { slot: slot });
        if (session !== openCount || sheet.hidden) return;
        if (result.success) {
          setState({ step: 3, submitting: false }, '#done-close');
        } else if (result.error === 'closed') {
          setState({ step: 1, submitting: false, slot: '', closed: state.closed.concat([slot]), notice: MSG.closed }, '#cal-next');
        } else {
          setState({ submitting: false, submitError: result.error === 'rate' ? MSG.busy : MSG.failed }, '#submit-btn');
        }
      });
  }

  function stepDone() {
    var row = function (key, value) { return el('div', {}, [el('dt', { text: key }), el('dd', { text: value })]); };
    var body = [
      el('div', { class: 'done-mark', 'aria-hidden': 'true' }, [icon('check', 36, 2.2)]),
      el('h2', { id: 'schedule-title', class: 'done-title', text: '신청이 접수되었습니다' }),
      el('dl', { class: 'kv' }, [
        row('일시', Core.formatSlot(state.slot)),
        row('담당', card.name + ' (' + card.company + ')'),
        row('신청자', state.name.trim() + ' · ' + Core.maskPhone(state.phone))
      ]),
      el('p', { class: 'done-guide' }, ['담당자가 확인 후 연락드립니다.', el('br'), '일정은 담당자 확정 후 정해집니다.'])
    ];
    var close = el('button', { type: 'button', class: 'btn-secondary', id: 'done-close', onclick: UI.closeLayer }, ['닫기']);
    return { head: null, body: body, foot: [close] };
  }

  /** 다시 그리기 전에 초점이 있던 자리를 선택자로 적어 둔다. 시트 밖이면 빈 문자열 */
  function focusedSelector() {
    var active = document.activeElement;
    if (!active || !sheet.contains(active)) return '';
    if (active.id) return '#' + active.id;
    if (active.dataset.date) return '.day[data-date="' + active.dataset.date + '"]';
    if (active.dataset.slot) return '.slot[data-slot="' + active.dataset.slot + '"]';
    return '#' + sheet.id;
  }

  function renderSheet(focusSelector) {
    focusSelector = focusSelector || focusedSelector();
    var view = state.step === 1 ? stepDate() : state.step === 2 ? stepForm() : stepDone();
    var main = el(view.onSubmit ? 'form' : 'div', { class: 'sheet-main', novalidate: view.onSubmit ? true : null, onsubmit: view.onSubmit || null }, [
      el('div', { class: 'sheet-body' }, view.body),
      el('div', { class: 'sheet-foot' }, view.foot)
    ]);
    sheet.textContent = '';
    sheet.appendChild(el('div', { class: 'grip', 'aria-hidden': 'true' }));
    if (view.head) sheet.appendChild(view.head);
    sheet.appendChild(main);

    if (!focusSelector) return;
    var target = sheet.querySelector(focusSelector);
    if (target && !target.disabled) target.focus();
    else sheet.focus();
  }

  function requestClose() {
    if (state.submitting) return; // 저장 결과를 보여줄 때까지 닫지 않는다 (응답이 없으면 15초 뒤 실패로 풀린다)
    var hasInput = state.step === 2 && (state.name || state.phone || state.purpose);
    if (hasInput && !root.confirm(MSG.confirmClose)) return;
    UI.closeLayer();
  }

  /** 저장소가 돌려준 일정 자료가 약속한 모양인지 확인한다. 화면과 선택자를 만드는 데 쓰이므로 엄격히 본다. */
  function isSlotsData(data) {
    var isIntList = function (list, min, max) {
      return Array.isArray(list) && list.length > 0 && list.every(function (n) {
        return typeof n === 'number' && n % 1 === 0 && n >= min && n <= max;
      });
    };
    return Boolean(data) && /^\d{4}-\d{2}-\d{2}$/.test(data.today) && Array.isArray(data.closed) &&
      Boolean(data.hours) && isIntList(data.hours.days, 0, 6) && isIntList(data.hours.hours, 0, 23);
  }

  /**
   * 일정 자료를 요청한다. 방금 받은 것이 있으면 잠깐 다시 쓴다.
   * 화면을 열 때 미리 한 번 불러 두므로 [일정 잡기]를 누르면 대개 바로 달력이 뜬다.
   */
  function requestSlots() {
    var now = Date.now();
    if (!slotsRequest || now - slotsRequest.at > SLOTS_FRESH_MS) slotsRequest = { at: now, promise: store.getSlots() };
    return slotsRequest.promise;
  }

  function loadSlots() {
    var session = openCount;
    requestSlots().then(function (result) {
      if (!result.success || !isSlotsData(result.data)) slotsRequest = null; // 실패한 응답은 다시 쓰지 않는다
      if (session !== openCount || sheet.hidden) return;
      if (!result.success || !isSlotsData(result.data)) { setState({ loading: false, loadFailed: true }, '#slots-retry'); return; }
      var data = result.data;
      setState({
        loading: false, loadFailed: false, hours: data.hours, today: data.today,
        closed: data.closed.filter(function (key) { return /^\d{4}-\d{2}-\d{2}T\d{2}$/.test(String(key)); }),
        year: Number(data.today.slice(0, 4)), month: Number(data.today.slice(5, 7))
      });
    });
  }

  function openSchedule() {
    store.logEvent('schedule_open');
    openCount += 1;
    state = initialState();
    renderSheet();
    UI.openLayer(sheet, { onRequestClose: requestClose });
    loadSlots();
  }

  /* ---------- 시작 ---------- */

  function init() {
    sheet = document.getElementById('schedule-sheet');
    renderMain();
    store.logEvent('card_view');
    // 일정을 미리 불러 둔다. 달력이 빨리 뜨고, 저장소가 다시 보내기를 지원하는지도 일찍 알게 된다.
    requestSlots();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window);
</script>
</body>
</html>
