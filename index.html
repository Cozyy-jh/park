<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/; font-src https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F4F6">
<meta name="format-detection" content="telephone=no">
<title>박정훈 · 삼성화재금융서비스 | 인증 명함</title>
<meta name="description" content="앱 설치 없이 확인하는 인증 명함">
<!-- 링크 미리보기(FR-13). 배포 주소가 정해지면 og:image 를 전체 주소로 바꾼다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="박정훈 · 삼성화재금융서비스">
<meta property="og:description" content="앱 설치 없이 확인하는 인증 명함">
<meta property="og:image" content="assets/card-front.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="screen customer-screen">
  <div>
    <div id="card-slot"></div>
    <p class="hint" id="flip-hint" aria-live="polite">명함을 탭하면 뒤집힙니다</p>
    <div class="actions" id="actions"></div>
    <nav class="icon-links" id="icon-links" aria-label="연락 채널"></nav>
  </div>
  <p class="demo-notice">수동 확인 기반 시연 화면입니다<small>트러스트 파이프라인</small></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dim" id="dim" hidden></div>
<section class="popup" id="verify-popup" role="dialog" aria-modal="true" aria-labelledby="verify-title" hidden></section>
<section class="sheet" id="schedule-sheet" role="dialog" aria-modal="true" aria-labelledby="schedule-title" hidden></section>

<noscript><p class="demo-notice">이 명함은 자바스크립트를 켜야 볼 수 있습니다.</p></noscript>

<script src="js/config.js"></script>
<script src="js/card-data.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
