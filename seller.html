<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- QR 보기에서만 cdnjs 의 qrcode-generator 를 불러온다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js; style-src 'self' https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/; font-src https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F6">
<meta name="format-detection" content="telephone=no">
<title>영업자 화면 | 트러스트 파이프라인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="screen" id="root"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dim" id="dim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>

<noscript><p class="demo-notice">이 화면은 자바스크립트를 켜야 볼 수 있습니다.</p></noscript>

<script src="js/config.js"></script>
<script src="js/card-data.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/seller.js"></script>
</body>
</html>
