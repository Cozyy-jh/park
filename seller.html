<title>영업자 화면 | 트러스트 파이프라인</title>

<style>
/* 트러스트 파이프라인 MVP — 고객용·영업자용 공용 스타일. 값은 피그마 색 변수와 화면설계서 치수를 따른다. */
:root {
  --primary: #2F6FED;
  --primary-strong: #1F5AD6;
  --primary-bg: #EAF1FF;
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --text: #191F28;
  --text-sub: #4E5968;
  --text-weak: #5F6B7A;
  --text-muted: #8B95A1;
  --line: #E5E8EB;
  --success: #0B7A4B;
  --success-bg: #E3F5EC;
  --warning: #9A5007; /* 피그마 값(#B25E09)보다 조금 어둡게: 연한 바탕 위 글자 대비 4.5:1 확보 */
  --warning-bg: #FFF1DB;
  --danger: #D92D20;
  --danger-strong: #B42318;
  --danger-bg: #FDECEA;
  --disabled: #C9D1DB;
  --off: #B0B8C1;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #E9ECEF; color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.45; word-break: keep-all;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
button { padding: 0; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.center { text-align: center; }

.screen { position: relative; max-width: 430px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); }

/* ---------- 고객용 R-01, R-02 ---------- */
.customer-screen { display: flex; flex-direction: column; justify-content: space-between; padding: 24px 16px 16px; }

.card { display: block; width: 100%; aspect-ratio: 328 / 182; border-radius: 12px; perspective: 1200px; }
.card-inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
.card[aria-pressed="true"] .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: block; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.face-back { transform: rotateY(180deg); }
.face.loading { background: #E9ECEF; }
.face img { display: block; width: 100%; height: 100%; object-fit: cover; }
.face-text { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 20px; text-align: left; }
.face-text-back { align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ft-co { font-size: 12px; line-height: 16px; color: var(--text-sub); }
.ft-main { display: block; }
.ft-name { display: block; font-size: 24px; font-weight: 700; line-height: 30px; }
.ft-name-sm { font-size: 16px; font-weight: 700; line-height: 24px; }
.ft-sub { display: block; font-size: 13px; line-height: 18px; color: var(--text-sub); }

.hint { margin-top: 8px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-sub); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; border-radius: 14px; background: var(--surface); font-size: 13px; font-weight: 500; line-height: 18px; }
.action:active { background: #E9EDF2; }
.action > svg { color: var(--primary); }

.badge { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; line-height: 14px; }
.badge[data-state="valid"] { color: var(--success); }
.badge[data-state="partial"] { color: var(--warning); }
.badge[data-state="expired"] { color: var(--text-weak); }
.popup .badge { gap: 3px; padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 16px; }
.popup .badge[data-state="valid"] { background: var(--success-bg); }
.popup .badge[data-state="partial"] { background: var(--warning-bg); }
.popup .badge[data-state="expired"] { background: var(--bg); }

.icon-links { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
.icon-link { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--text-sub); }

.demo-notice { margin-top: 24px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-sub); }
.demo-notice small { display: block; margin-top: 2px; font-size: 11px; line-height: 14px; color: var(--text-weak); }

/* ---------- 토스트, 팝업, 시트 ---------- */
.toast { position: fixed; left: 50%; bottom: 56px; z-index: 60; width: min(312px, calc(100% - 48px)); min-height: 40px; padding: 11px 12px; border-radius: 12px; background: var(--text); color: #fff; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.dim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .6); opacity: 0; transition: opacity .2s; }
.dim.show { opacity: 1; }

.popup { position: fixed; left: 50%; top: 50%; z-index: 50; width: min(398px, calc(100% - 32px)); max-height: min(640px, calc(100vh - 48px)); overflow-y: auto; padding: 20px; border-radius: 16px; background: var(--surface); outline: 0; opacity: 0; transform: translate(-50%, -48%); transition: opacity .2s, transform .2s; }
.popup.show { opacity: 1; transform: translate(-50%, -50%); }
.popup-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.popup-head h2 { font-size: 20px; line-height: 28px; }
.popup-who { margin: 4px 0 8px; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.verify-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.verify-label { font-size: 15px; font-weight: 500; line-height: 22px; }
.verify-state { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; line-height: 18px; color: var(--text-sub); text-align: right; }
.verify-state small { font-size: 12px; line-height: 16px; color: var(--text-weak); }
.verify-row[data-status="pending"] .verify-main { color: var(--warning); font-weight: 500; }
.verify-row[data-status="expired"] .verify-label, .verify-row[data-status="expired"] .verify-main { color: var(--text-weak); }
.popup-note { margin-top: 10px; font-size: 13px; color: var(--warning); }
.popup-foot { margin: 10px 0 14px; font-size: 12px; line-height: 18px; color: var(--text-sub); }

.sheet { position: fixed; left: 50%; bottom: 0; z-index: 50; display: flex; flex-direction: column; width: min(430px, 100%); height: min(720px, 90vh); padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--surface); outline: 0; opacity: 0; transform: translate(-50%, 24px); transition: opacity .2s, transform .25s; }
.sheet.show { opacity: 1; transform: translate(-50%, 0); }
.sheet-auto { height: auto; max-height: 90vh; }
.sheet-detail { height: min(640px, 90vh); }
.grip { flex: none; width: 36px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: var(--line); }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.sheet-head h2 { display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px; }
.sheet-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.sheet-body { flex: 1; min-height: 0; margin: 0 -16px; padding: 0 16px 4px; overflow-y: auto; }
.sheet-foot { flex: none; padding-top: 12px; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -10px; border-radius: 50%; color: var(--text-sub); }
.icon-btn:disabled { color: var(--disabled); }
.back-btn { margin: 0 0 0 -10px; color: var(--text); }

/* ---------- 버튼, 입력 ---------- */
.btn-primary, .btn-secondary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 12px; font-size: 16px; line-height: 24px; }
.btn-primary { background: var(--primary); color: #fff; font-weight: 700; }
.btn-primary:disabled { background: var(--disabled); }
.btn-secondary { background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); color: var(--primary-strong); font-weight: 500; }
.btn-secondary:disabled { box-shadow: inset 0 0 0 1px var(--disabled); color: var(--off); }
.btn-small { height: 40px; border-radius: 10px; font-size: 14px; line-height: 20px; }
.link-btn { min-height: 44px; padding: 0 4px; color: var(--primary-strong); font-size: 13px; font-weight: 500; }
.link-btn.sub { color: var(--text-sub); text-decoration: underline; }
.text-link { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 500; color: var(--text-sub); text-decoration: underline; }

.field { margin-top: 12px; }
.field label, .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.form-label { margin-top: 20px; }
.input, .textarea { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; outline: 0; }
.input { height: 48px; padding: 0 16px; }
.textarea { height: 96px; padding: 12px 16px; resize: none; }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.input:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.input:disabled { background: var(--bg); }
.has-error .input, .input.is-error { border-color: var(--danger); }
.error { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--danger); }
.inline-notice { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--danger-bg); color: var(--danger-strong); font-size: 13px; line-height: 18px; }

/* ---------- 고객용 R-04, R-05 ---------- */
.stepper { display: flex; gap: 6px; padding-bottom: 12px; font-size: 13px; line-height: 18px; color: var(--text-weak); }
.stepper .on { color: var(--primary-strong); font-weight: 700; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 8px; }
.month-nav strong { min-width: 104px; text-align: center; font-size: 16px; line-height: 24px; }
.month-nav .icon-btn { margin: 0; }
.cal-row { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-head span { height: 24px; text-align: center; font-size: 12px; line-height: 24px; color: var(--text-weak); }
.day-wrap { display: grid; place-items: center; height: 40px; }
.day { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; line-height: 22px; color: var(--off); }
button.day { color: var(--text); font-weight: 500; }
button.day::after { content: ""; position: absolute; inset: -2px -5px; }
.day[data-state="today"] { box-shadow: inset 0 0 0 1px var(--disabled); }
.day[data-state="selected"] { background: var(--primary); color: #fff; font-weight: 700; }
.sub-label { margin: 10px 0 8px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { position: relative; height: 40px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; }
.slot::after { content: ""; position: absolute; inset: -2px 0; }
.slot[data-state="selected"] { background: var(--primary); box-shadow: none; color: #fff; font-weight: 700; }
.slot[data-state="closed"] { background: var(--bg); box-shadow: none; color: var(--off); text-decoration: line-through; }
.empty-box { padding: 24px 16px; border-radius: 12px; background: var(--bg); text-align: center; font-size: 14px; line-height: 20px; color: var(--text-sub); }
.summary { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 12px; padding: 0 16px; border-radius: 12px; background: var(--primary-bg); font-size: 15px; font-weight: 500; line-height: 22px; }
.stepper + .summary { margin-top: 0; }
.summary .link-btn { margin-right: -4px; }

.consent { margin-top: 16px; }
.consent-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.check { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer; }
.check-input { position: absolute; left: 0; top: 10px; width: 24px; height: 24px; margin: 0; opacity: 0; }
.check-box { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid var(--off); border-radius: 6px; color: transparent; }
.check-input:checked + .check-box { border-color: var(--primary); background: var(--primary); color: #fff; }
.check-input:focus-visible + .check-box { outline: 2px solid var(--primary); outline-offset: 2px; }
.has-error .check-box { border-color: var(--danger); }
.consent-detail { margin-top: 6px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: 12px; line-height: 18px; color: var(--text-sub); }

.done-mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 32px auto 20px; border-radius: 50%; background: var(--success-bg); color: var(--success); }
.done-title { text-align: center; font-size: 20px; line-height: 28px; }
.kv { display: grid; gap: 10px; margin-top: 20px; padding: 16px; border-radius: 12px; background: var(--bg); }
.kv div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kv dt { flex: none; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.kv dd { font-size: 14px; font-weight: 500; line-height: 20px; text-align: right; overflow-wrap: anywhere; }
.done-guide { margin-top: 16px; text-align: center; font-size: 13px; line-height: 20px; color: var(--text-sub); }

/* ---------- 영업자용 S-01 ---------- */
.login { display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; min-height: 100dvh; padding: 128px 16px 24px; background: var(--surface); }
.login-service { text-align: center; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.login h1 { text-align: center; font-size: 24px; line-height: 32px; }
.card-summary { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; margin-top: 32px; padding: 8px; border-radius: 12px; background: var(--bg); text-align: center; }
.card-summary strong { font-size: 15px; line-height: 20px; }
.card-summary span { font-size: 12px; line-height: 16px; color: var(--text-sub); }
.login-form { margin-top: 24px; }
.login-form label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text-sub); }
.login-form .btn-primary { margin-top: 16px; }
.pin { font-size: 20px; letter-spacing: .4em; }
.login-key { margin-bottom: 16px; }
.field-hint { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--text-sub); }

/* ---------- 영업자용 공통 틀 ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.band { flex: none; padding: 4px 12px; background: var(--warning-bg); color: var(--warning); font-size: 12px; font-weight: 500; line-height: 16px; text-align: center; }
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; }
.topbar h1 { font-size: 20px; line-height: 28px; }
.topbar-count { font-size: 13px; color: var(--text-sub); }
.share-btn { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px 0 10px; border-radius: 16px; background: var(--primary-bg); color: var(--primary-strong); font-size: 13px; font-weight: 700; }
.share-btn::after { content: ""; position: absolute; inset: -6px 0; }
.view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 12px 16px 16px; overflow-y: auto; }
.view > * { flex: none; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: var(--surface); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-sub); font-size: 11px; font-weight: 500; line-height: 14px; }
.tab[aria-current="page"] { color: var(--primary-strong); font-weight: 700; }
.tab-label { display: inline-flex; align-items: flex-start; gap: 2px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--danger); }

.chips { display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { position: relative; flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-sub); font-size: 13px; font-weight: 500; }
.chip::after { content: ""; position: absolute; inset: -6px 0; }
.chip[data-selected="true"] { background: var(--text); box-shadow: none; color: #fff; font-weight: 700; }

/* ---------- 영업자용 S-02 ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 72px; padding: 0 14px; border-radius: 14px; background: var(--surface); }
.stat dt { font-size: 13px; line-height: 18px; color: var(--text-sub); }
.stat dd { font-size: 24px; font-weight: 700; line-height: 30px; }
.rate { margin-top: -4px; font-size: 13px; line-height: 18px; color: var(--text-sub); }
.block { padding: 16px; border-radius: 16px; background: var(--surface); }
.block h2 { margin-bottom: 12px; font-size: 16px; line-height: 24px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; height: 24px; font-size: 13px; line-height: 18px; }
.bar-name { color: var(--text-sub); }
.bar-track { height: 8px; overflow: hidden; border-radius: 4px; background: var(--bg); }
.bar-track i { display: block; height: 100%; border-radius: 4px; background: var(--primary); }
.bar-count { text-align: right; font-weight: 500; }
.activity { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.activity:last-child { border-bottom: 0; }
.activity strong { display: block; font-size: 14px; line-height: 20px; }
.activity p { font-size: 13px; line-height: 18px; color: var(--text-sub); }
.activity-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 16px; color: var(--text-sub); }
.activity-side .link-btn { position: relative; min-height: 28px; font-size: 12px; font-weight: 700; }
.activity-side .link-btn::after { content: ""; position: absolute; inset: -8px -8px; }
.more-btn { display: block; width: 100%; height: 44px; font-size: 13px; font-weight: 500; color: var(--text-sub); }
.empty-state { padding: 32px 16px 24px; border-radius: 16px; background: var(--surface); text-align: center; font-size: 14px; line-height: 20px; color: var(--text-sub); }
.empty-state .btn-primary { width: 160px; margin: 14px auto 0; }
.notice-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-radius: 10px; background: var(--danger-bg); color: var(--danger-strong); font-size: 13px; }
.notice-row .link-btn { color: var(--danger-strong); text-decoration: underline; }
.loading-text { padding: 24px 0; text-align: center; font-size: 14px; color: var(--text-sub); }

/* ---------- 영업자용 S-03 ---------- */
.customers { display: grid; gap: 8px; }
.customer { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-height: 76px; padding: 12px; border-radius: 14px; background: var(--surface); text-align: left; }
.customer[data-status="new"] { box-shadow: inset 0 0 0 1.5px var(--primary); }

    if (state.login.busy || pin.length !== 6) return;
    state = Object.assign({}, state, { login: Object.assign({}, state.login, { busy: true }) });
    button.disabled = true;
    store.login(pin).then(function (result) {
      if (result.success) {
        setState({ view: 'app', login: NO_LOGIN_ERROR });
        loadData();
      } else if (result.error === 'locked') {
        startLock(result.data.wait);
      } else {
        var byCode = { key: MSG.needLink, no_pin: MSG.noPin, config: MSG.noStore };
        var message = result.error === 'wrong'
          ? '비밀번호가 맞지 않습니다 (' + result.data.fails + '/' + result.data.max + ')'
          : byCode[result.error] || MSG.loadFailed;
        setState({ login: { error: message, lockedUntil: 0, busy: false } });
        focusPin();
      }
    });
  }

  function loginView() {
    var login = state.login;
    var locked = login.lockedUntil > Date.now();
    var input = el('input', {
      id: 'pin', class: 'input pin' + (login.error ? ' is-error' : ''), type: 'password', inputmode: 'numeric',
      pattern: '[0-9]*', maxlength: '6', autocomplete: 'off', disabled: locked,
      'aria-invalid': login.error ? 'true' : null, 'aria-describedby': login.error ? 'pin-err' : null
    });
    var button = el('button', { type: 'submit', class: 'btn-primary', disabled: true }, ['접속']);
    // 이 브라우저에 관리 링크 값이 없으면 여기서 붙여 넣게 한다 (주소 끝에 #k=… 를 붙이는 것과 같다)
    var keyInput = store.needsSellerKey() ? el('input', {
      id: 'link-key', class: 'input', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
      placeholder: 'seller.html#k=…', disabled: locked, 'aria-describedby': 'link-key-hint'
    }) : null;
    var syncButton = function () {
      var value = Core.digits(input.value).slice(0, 6);
      if (value !== input.value) input.value = value;
      var keyMissing = Boolean(keyInput) && keyInput.value.trim() === '';
      button.disabled = value.length !== 6 || keyMissing || state.login.busy;
    };
    input.addEventListener('input', syncButton);
    if (keyInput) keyInput.addEventListener('input', syncButton);
    var onSubmit = function (event) {
      event.preventDefault();
      if (keyInput && !store.saveSellerKey(keyInput.value)) {
        setState({ login: { error: MSG.badLink, lockedUntil: 0, busy: false } });
        focusPin();
        return;
      }
      submitPin(input.value, button);
    };
    var form = el('form', { class: 'login-form', novalidate: true, onsubmit: onSubmit }, [
      keyInput ? el('div', { class: 'login-key' }, [
        el('label', { for: 'link-key', text: MSG.linkLabel }), keyInput,
        el('p', { class: 'field-hint', id: 'link-key-hint', text: MSG.linkHint })
      ]) : null,
      el('label', { for: 'pin', text: '비밀번호' }), input,
      login.error ? el('p', { class: 'error', id: 'pin-err', role: locked ? null : 'alert', text: login.error }) : null,
      button
    ]);
    return el('main', { class: 'login' }, [
      el('div', {}, [
        el('p', { class: 'login-service', text: '트러스트 파이프라인' }),
        el('h1', { text: '영업자 화면' }),
        el('div', { class: 'card-summary' }, [
          el('strong', { text: card.name }),
          el('span', { text: [card.company, card.division].filter(Boolean).join(' ') })
        ]),
        form
      ]),
      el('p', { class: 'demo-notice' }, ['1R 시연용 간이 접속입니다.', el('br'), '정식 회원가입과 본인인증은 2R에서 제공합니다.'])
    ]);
  }

  /* ---------- 공통 틀 ---------- */

  function loadData() {
    setState({ loading: true });
    return store.dashboard().then(function (result) {
      if (handleAuth(result)) return;
      if (result.success) setState({ data: result.data, loading: false, loadError: false });
      else setState({ loading: false, loadError: true });
    });
  }

  function switchTab(id) {
    setState({ tab: id, visitLimit: VISIT_PAGE });
    loadData();
  }

  function chipRow(label, items) {
    return el('div', { class: 'chips', role: 'group', 'aria-label': label }, items.map(function (item) {
      return el('button', {
        type: 'button', class: 'chip', dataset: { selected: String(item.on), fk: 'chip-' + item.id },
        'aria-pressed': String(item.on), onclick: item.onClick
      }, [item.label]);
    }));
  }

  function statusChip(status) {
    return el('span', { class: 'status', dataset: { state: status }, text: Core.statusLabel(status) || status });
  }

  function emptyState(lines) {
    return el('div', { class: 'empty-state' }, [
      el('p', {}, [lines[0], el('br'), lines[1]]),
      el('button', { type: 'button', class: 'btn-primary btn-small', dataset: { fk: 'empty-share' }, onclick: openShare }, ['명함 공유'])
    ]);
  }

  function loadNotice() {
    return el('div', { class: 'notice-row', role: 'alert' }, [
      el('span', { text: MSG.loadFailed }),
      el('button', { type: 'button', class: 'link-btn', dataset: { fk: 'retry' }, onclick: loadData }, ['다시 시도'])
    ]);
  }

  function tabButton(tab, hasNew) {
    var on = tab.id === state.tab;
    return el('button', {
      type: 'button', class: 'tab', dataset: { tab: tab.id, fk: 'tab-' + tab.id },
      'aria-current': on ? 'page' : null, onclick: function () { switchTab(tab.id); }
    }, [
      icon(tab.icon, 22),
      el('span', { class: 'tab-label' }, [
        tab.label,
        hasNew ? el('i', { class: 'dot' }, [el('span', { class: 'sr-only', text: ' 새 신청 있음' })]) : null
      ])
    ]);
  }

  function appView() {
    var counts = Core.bookingCounts(state.data ? state.data.bookings : []);
    var title = TABS.filter(function (t) { return t.id === state.tab; })[0].label;
    var content = state.tab === 'insight' ? insightView() : state.tab === 'customers' ? customersView(counts) : myCardView();
    var right = state.tab === 'customers'
      ? el('span', { class: 'topbar-count', text: counts.all + '건' })
      : el('button', { type: 'button', class: 'share-btn', dataset: { fk: 'share' }, onclick: openShare }, [icon('share', 16, 2), '공유']);

    var bandText = store.mode === 'local' ? MSG.localMode : store.mode === 'unavailable' ? MSG.noStore : '';

    return el('div', { class: 'app' }, [
      bandText ? el('p', { class: 'band', text: bandText }) : null,
      el('header', { class: 'topbar' }, [el('h1', { text: title }), right]),
      el('main', { class: 'view', id: 'view' }, content),
      el('nav', { class: 'tabbar', 'aria-label': '메뉴' }, TABS.map(function (tab) {
        return tabButton(tab, tab.id === 'customers' && counts.new > 0);
      }))
    ]);
  }

  /* ---------- S-02 인사이트 ---------- */

  function statGrid(summary) {
    var tile = function (label, value) { return el('div', { class: 'stat' }, [el('dt', { text: label }), el('dd', { text: String(value) })]); };
    return el('dl', { class: 'stats' }, [
      tile('명함 열람', summary.views), tile('방문자', summary.visitors),
      tile('명함 활동', summary.actions), tile('일정 신청', summary.bookingCount)
    ]);
  }

  function barBlock(title, rows) {
    var max = rows.reduce(function (m, row) { return Math.max(m, row[1]); }, 0);
    return el('section', { class: 'block' }, [
      el('h2', { text: title }),
      el('ul', { class: 'bars' }, rows.map(function (row) {
        var fill = el('i');
        fill.style.width = (max ? Math.round((row[1] / max) * 100) : 0) + '%';
        return el('li', { class: 'bar-row' }, [
          el('span', { class: 'bar-name', text: row[0] }),
          el('span', { class: 'bar-track', 'aria-hidden': 'true' }, [fill]),
          el('span', { class: 'bar-count', text: String(row[1]) })
        ]);
      }))
    ]);
  }

  function activityBlock() {
    var visits = Core.recentVisits(state.data.events, state.period, Date.now());
    var rows = visits.slice(0, state.visitLimit).map(function (visit) {
      return el('li', { class: 'activity' }, [
        el('div', {}, [el('strong', { text: visit.label }), el('p', { text: visit.steps.join(' → ') })]),
        el('div', { class: 'activity-side' }, [
          el('span', { text: Core.formatStamp(visit.ts) }),
          visit.hasBooking ? el('button', { type: 'button', class: 'link-btn', onclick: function () { switchTab('customers'); } }, ['고객 보기']) : null
        ])
      ]);
    });
    var more = visits.length > state.visitLimit ? el('button', {
      type: 'button', class: 'more-btn', dataset: { fk: 'more' },
      onclick: function () { setState({ visitLimit: state.visitLimit + VISIT_PAGE }); }
    }, ['더 보기']) : null;
    return el('section', { class: 'block' }, [el('h2', { text: '최근 활동' }), el('ul', {}, rows), more]);
  }

  function insightView() {
    var nodes = [chipRow('기간', PERIODS.map(function (p) {
      return { id: p[0], label: p[1], on: p[0] === state.period, onClick: function () { setState({ period: p[0], visitLimit: VISIT_PAGE }); } };
    }))];
    if (state.loadError) nodes.push(loadNotice());
    if (!state.data) {
      if (state.loading) nodes.push(el('p', { class: 'loading-text', text: '불러오는 중…' }));
      return nodes;
    }
    var s = Core.summarize(state.data, state.period, Date.now());
    if (state.data.truncated) nodes.push(el('p', { class: 'rate', role: 'status', text: MSG.truncated }));
    nodes.push(statGrid(s));
    nodes.push(el('p', { class: 'rate', text: '전달 ' + s.delivered + '건' + (s.viewRate === null ? '' : ' · 열람률 ' + s.viewRate + '%') }));
    if (s.views === 0) return nodes.concat([emptyState(MSG.noViews)]);
    return nodes.concat([
      barBlock('유입 경로', [['카카오톡', s.sources.kakao], ['문자', s.sources.sms], ['QR', s.sources.qr], ['기타', s.sources.etc]]),
      barBlock('명함 활동', [['인증내역', s.actionsBy.verify], ['전화 저장', s.actionsBy.save], ['일정 잡기', s.actionsBy.schedule], ['명함 뒤집기', s.actionsBy.flip], ['하단 아이콘', s.actionsBy.icons]]),
      activityBlock()
    ]);
  }

  /* ---------- S-03 고객 ---------- */

  function isSlotKey(value) { return /^\d{4}-\d{2}-\d{2}T\d{2}$/.test(String(value)); }
  function slotText(slot, short) {
    if (!isSlotKey(slot)) return String(slot || '-');
    return short ? Core.formatSlotShort(slot) : Core.formatSlot(slot);
  }
  function stampText(ts, long) {
    if (isNaN(Date.parse(ts))) return '-';
    return long ? Core.formatStampLong(ts) : Core.formatStamp(ts);
  }

  function customerCard(booking) {
    var line = slotText(booking.slot, true) + (booking.purpose ? ' · ' + booking.purpose : '');
    return el('li', {}, [
      el('button', {
        type: 'button', class: 'customer', dataset: { id: String(booking.id), status: String(booking.status), fk: 'c-' + booking.id },
        onclick: function () { openDetail(String(booking.id)); }
      }, [
        el('span', { class: 'customer-main' }, [
          el('strong', { text: String(booking.name) }),
          el('span', { class: 'customer-slot', text: line }),
          el('span', { class: 'customer-at', text: '신청 ' + stampText(booking.createdAt, false) })
        ]),
        statusChip(String(booking.status))
      ])
    ]);
  }

  function customersView(counts) {
    var nodes = [chipRow('처리 상태', FILTERS.map(function (f) {
      return { id: f[0], label: f[1] + ' ' + counts[f[0]], on: f[0] === state.filter, onClick: function () { setState({ filter: f[0] }); } };
    }))];
    if (state.loadError) nodes.push(loadNotice());
    if (!state.data) {
      if (state.loading) nodes.push(el('p', { class: 'loading-text', text: '불러오는 중…' }));
      return nodes;
    }
    if (counts.all === 0) return nodes.concat([emptyState(MSG.noBookings)]);
    var list = Core.sortBookings(state.data.bookings).filter(function (b) { return state.filter === 'all' || b.status === state.filter; });
    if (!list.length) return nodes.concat([el('p', { class: 'loading-text', text: '이 상태의 신청이 없습니다.' })]);
    return nodes.concat([el('ul', { class: 'customers' }, list.map(customerCard))]);
  }

  function currentBooking() {
    if (!state.data) return null;
    return state.data.bookings.filter(function (b) { return String(b.id) === detailId; })[0] || null;
  }

  function withBooking(id, patch) {
    var bookings = state.data.bookings.map(function (b) { return String(b.id) === id ? Object.assign({}, b, patch) : b; });
    return Object.assign({}, state.data, { bookings: bookings });
  }

  function applyBooking(id, patch) { setState({ data: withBooking(id, patch) }); }

  function isDetailOpen(id) { return sheetKind === 'detail' && detailId === id && !sheet.hidden; }

  function changeStatus(id, status) {
    var before = currentBooking();
    if (!before || before.status === status) return;
    applyBooking(id, { status: status });
    renderDetail('#seg-' + status);
    store.updateBooking(id, { status: status }).then(function (result) {
      if (handleAuth(result)) return;
      if (result.success) { UI.toast("상태를 '" + Core.statusLabel(status) + "'(으)로 저장했습니다."); return; }
      applyBooking(id, { status: before.status });
      if (isDetailOpen(id)) renderDetail(STATUS_IDS.indexOf(before.status) === -1 ? null : '#seg-' + before.status);
      UI.toast(MSG.saveFailed);
    });
  }

  /* 메모는 입력을 멈추면 저장한다. 다른 신청으로 넘어가면 기다리던 메모를 먼저 보낸다. */
  function flushMemo() {
    if (!memoJob) return;
    var job = memoJob;
    memoJob = null;
    clearTimeout(job.timer);
    store.updateBooking(job.id, { memo: job.value }).then(function (result) {
      if (handleAuth(result)) return;
      var note = document.getElementById('memo-state');
      if (note && isDetailOpen(job.id)) note.textContent = result.success ? '저장됨' : MSG.saveFailed;
    });
  }

  function queueMemo(id, value) {
    if (memoJob && memoJob.id !== id) flushMemo();
    if (memoJob) clearTimeout(memoJob.timer);
    memoJob = { id: id, value: value, timer: setTimeout(flushMemo, MEMO_SAVE_MS) };
    // 화면 상태에도 바로 반영해 둔다. 상태 버튼을 눌러 다시 그려도 입력하던 글이 남는다.
    state = Object.assign({}, state, { data: withBooking(id, { memo: value }) });
  }

  function sheetHead(titleNodes) {
    return el('div', { class: 'sheet-head' }, [
      el('h2', { id: 'sheet-title' }, titleNodes),
      el('button', { type: 'button', class: 'icon-btn', 'aria-label': '닫기', onclick: UI.closeLayer }, [icon('close')])
    ]);
  }

  function renderSheet(className, nodes, focusSelector) {
    sheet.className = 'sheet show ' + className;
    sheet.textContent = '';
    sheet.appendChild(el('div', { class: 'grip', 'aria-hidden': 'true' }));
    nodes.forEach(function (node) { if (node) sheet.appendChild(node); });
    var target = focusSelector ? sheet.querySelector(focusSelector) : null;
    if (target && !target.disabled) target.focus();
  }

  function renderDetail(focusSelector) {
    var booking = currentBooking();
    if (!booking) { UI.closeLayer(); return; }
    var id = String(booking.id);
    var tel = Core.digits(booking.phone);
    var row = function (key, value) { return el('div', {}, [el('dt', { text: key }), el('dd', { text: value })]); };
    var memo = el('textarea', { id: 'memo', class: 'textarea', maxlength: '500', placeholder: '메모를 남겨 주세요' });
    memo.value = String(booking.memo || '');
    memo.addEventListener('input', function () {
      document.getElementById('memo-state').textContent = '';
      queueMemo(id, memo.value);
    });

    renderSheet('sheet-detail', [
      sheetHead([el('span', { text: String(booking.name) }), statusChip(String(booking.status))]),
      el('div', { class: 'sheet-body' }, [
        el('dl', { class: 'info' }, [
          row('연락처', Core.formatPhone(tel) || '-'),
          row('희망 일시', slotText(booking.slot, false)),
          row('용건', String(booking.purpose || '-')),
          row('신청 일시', stampText(booking.createdAt, true))
        ]),
        el('div', { class: 'contact-row' }, [
          el('a', { class: 'btn-primary btn-small', href: 'tel:' + tel }, ['전화']),
          el('a', { class: 'btn-secondary btn-small', href: 'sms:' + tel + '?&body=' + encodeURIComponent(SMS_BODY) }, ['문자'])
        ]),
        el('h3', { class: 'form-label', id: 'status-label', text: '상태' }),
        el('div', { class: 'segmented', role: 'group', 'aria-labelledby': 'status-label' }, STATUS_IDS.map(function (status) {
          return el('button', {
            type: 'button', id: 'seg-' + status, 'aria-pressed': String(booking.status === status),
            onclick: function () { changeStatus(id, status); }
          }, [Core.statusLabel(status)]);
        })),
        el('label', { class: 'form-label', for: 'memo', text: '메모' }),
        memo,
        el('p', { class: 'memo-state', id: 'memo-state', 'aria-live': 'polite' })
      ])
    ], focusSelector);
  }

  function openDetail(id) {
    detailId = id;
    sheetKind = 'detail';
    UI.openLayer(sheet);
    renderDetail();
  }

  /* ---------- S-05 내 명함 ---------- */

  function myCardView() {
    cardNode = cardNode || UI.createCard(card);
    return [
      cardNode,
      el('p', { class: 'center' }, [
        el('a', { class: 'text-link', href: Core.shareUrl(cardUrl, 'preview'), target: '_blank', rel: 'noopener' }, [
          '고객 화면으로 보기', el('span', { class: 'sr-only', text: ' (새 창)' }), icon('external', 14, 2)
        ])
      ])
    ];
  }

  /* ---------- S-06 공유 ---------- */

  function copyLink(src) {
    UI.copyText(Core.shareUrl(cardUrl, src)).then(function (copied) {
      UI.toast(copied ? '링크를 복사했습니다' : '복사하지 못했습니다. 다시 시도해 주세요.');
    });
  }

  function setDeliveries(deliveries) {
    setState({ data: Object.assign({}, state.data, { deliveries: deliveries }) });
  }

  var pendingDelivery = null; // 저장을 기다리는 값과, 실패했을 때 되돌릴 목록
  var flushDelivery = UI.debounce(function () {
    var pending = pendingDelivery;
    pendingDelivery = null;
    if (!pending) return;
    store.setDelivery(pending.date, pending.count).then(function (result) {
      if (result.success || handleAuth(result)) return;
      setDeliveries(pending.before);
      if (!sheet.hidden && sheetKind === 'share' && shareView === 'main') renderShare();
      UI.toast(MSG.saveFailed);
    });
  }, DELIVERY_SAVE_MS);

  function changeDelivery(delta) {
    if (!state.data) return;
    var date = today();
    var list = state.data.deliveries;
    var current = list.filter(function (d) { return d.date === date; })[0];
    var count = Math.max(0, Math.min(DELIVERY_MAX, (current ? Number(current.count) || 0 : 0) + delta));
    var next = current
      ? list.map(function (d) { return d.date === date ? { date: date, count: count } : d; })
      : list.concat([{ date: date, count: count }]);
    pendingDelivery = { date: date, count: count, before: pendingDelivery ? pendingDelivery.before : list };
    setDeliveries(next);
    renderShare(delta < 0 ? '#cnt-minus' : '#cnt-plus');
    flushDelivery();
  }

  function renderShare(focusSelector) {
    if (shareView === 'qr') { renderQr(); return; }
    var totals = Core.deliveryTotals(state.data ? state.data.deliveries : [], today());
    var ready = Boolean(state.data);
    renderSheet('sheet-auto', [
      sheetHead([el('span', { text: '명함 공유' })]),
      el('div', { class: 'link-preview' }, [
        el('span', { class: 'mini-card', 'aria-hidden': 'true' }, [el('span', { text: card.company }), el('b', { text: card.name })]),
        el('div', {}, [el('strong', { text: card.name + ' · ' + card.company }), el('p', { text: '앱 설치 없이 확인하는 인증 명함' })])
      ]),
      el('div', { class: 'share-buttons' }, [
        el('button', { type: 'button', class: 'btn-primary', onclick: function () { copyLink('kakao'); } }, ['카카오톡용 링크 복사']),
        el('button', { type: 'button', class: 'btn-secondary', onclick: function () { copyLink('sms'); } }, ['문자용 링크 복사']),
        el('button', { type: 'button', class: 'btn-secondary', id: 'qr-open', onclick: function () { shareView = 'qr'; renderShare(); } }, ['QR 보기'])
      ]),
      el('h3', { class: 'form-label', id: 'cnt-label', text: '전달 건수 (명함을 보낸 사람 수)' }),
      el('div', { class: 'counter', role: 'group', 'aria-labelledby': 'cnt-label' }, [
        el('button', { type: 'button', id: 'cnt-minus', 'aria-label': '전달 건수 줄이기', disabled: !ready || totals.today === 0, onclick: function () { changeDelivery(-1); } }, [icon('minus', 20, 2.2)]),
        el('output', { 'aria-live': 'polite', text: String(totals.total) }),
        el('button', { type: 'button', id: 'cnt-plus', 'aria-label': '전달 건수 늘리기', disabled: !ready, onclick: function () { changeDelivery(1); } }, [icon('plus', 20, 2.2)])
      ]),
      el('p', { class: 'counter-caption', text: '오늘 ' + totals.today + '건 · 누적 ' + totals.total + '건' })
    ], focusSelector);
  }

  function openShare() {
    shareView = 'main';
    sheetKind = 'share';
    UI.openLayer(sheet);
    renderShare();
  }

  var qrLibPromise = null;
  function loadQrLib() {
    if (typeof root.qrcode === 'function') return Promise.resolve();
    if (!qrLibPromise) {
      qrLibPromise = new Promise(function (resolve, reject) {
        var script = el('script', { src: QR_LIB_URL, crossorigin: 'anonymous', referrerpolicy: 'no-referrer' });
        script.onload = function () { resolve(); };
        script.onerror = function () { qrLibPromise = null; reject(new Error('QR 라이브러리를 불러오지 못했습니다')); };
        document.head.appendChild(script);
      });
    }
    return qrLibPromise;
  }

  function drawQr(canvas, text) {
    var qr = root.qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var size = (count + QR_QUIET_MODULES * 2) * QR_MODULE_PX;
    var ctx = canvas.getContext('2d');
    canvas.width = size;
    canvas.height = size;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#191F28';
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + QR_QUIET_MODULES) * QR_MODULE_PX, (r + QR_QUIET_MODULES) * QR_MODULE_PX, QR_MODULE_PX, QR_MODULE_PX);
      }
    }
  }

  function renderQr() {
    var canvas = el('canvas', { role: 'img', 'aria-label': card.name + ' 명함 QR 코드' });
    var box = el('div', { class: 'qr-box', id: 'qr' }, ['QR을 만드는 중…']);
    var save = el('button', {
      type: 'button', class: 'btn-secondary', disabled: true,
      onclick: function () { canvas.toBlob(function (blob) { if (blob) UI.download(card.name + '_명함QR.png', blob); }, 'image/png'); }
    }, ['이미지 저장']);
    var back = el('button', {
      type: 'button', class: 'icon-btn back-btn', id: 'qr-back', 'aria-label': '공유로 돌아가기',
      onclick: function () { shareView = 'main'; renderShare('#qr-open'); }
    }, [icon('left', 24, 2)]);

    renderSheet('sheet-auto', [
      sheetHead([back, el('span', { text: 'QR' })]),
      box,
      el('p', { class: 'qr-title', text: '카메라로 찍으면 명함이 열립니다' }),
      el('p', { class: 'qr-sub', text: [card.name, [card.company, card.division].filter(Boolean).join(' ')].join(' · ') }),
      el('div', { class: 'qr-foot' }, [save])
    ], '#qr-back');

    loadQrLib().then(function () {
      drawQr(canvas, Core.shareUrl(cardUrl, 'qr'));
      box.textContent = '';
      box.appendChild(canvas);
      save.disabled = false;
    }).catch(function () {
      box.textContent = 'QR을 만들지 못했습니다. 인터넷 연결을 확인해 주세요.';
    });
  }

  /* ---------- 시작 ---------- */

  function init() {
    rootEl = document.getElementById('root');
    sheet = document.getElementById('sheet');
    // 열려 있는 화면의 주소 끝에 #k=… 를 붙여도 값을 받았으면 접속 화면을 다시 그린다
    store.onSellerKey(function () {
      if (state.view !== 'login') return;
      setState({ login: NO_LOGIN_ERROR });
      focusPin();
    });
    if (store.isSignedIn()) {
      state = Object.assign({}, state, { view: 'app' });
      render();
      loadData();
    } else {
      render();
      focusPin();
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window);
</script>
</body>
</html>
